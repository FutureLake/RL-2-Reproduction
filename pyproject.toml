[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rl2-reproduction"
version = "0.1.0"
description = "PPO reproduction of RL squared bandits, tabular MDPs and ViZDoom navigation"
requires-python = ">=3.11,<3.12"
dependencies = ["numpy>=1.26,<2", "torch>=2.8,<3", "mpi4py>=4.1,<5", "PyYAML>=6,<7", "Pillow>=10", "matplotlib>=3.8"]

[project.optional-dependencies]
navigation = ["vizdoom==1.3.2"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
