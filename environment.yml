name: rl2-reproduction
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - mpi4py>=4.1,<5
  - msmpi=10.1.1  # Windows; replace with openmpi on Linux/macOS
  - pip:
      - numpy==1.26.4
      - torch==2.8.0
      - vizdoom==1.3.2
      - Pillow>=10
      - matplotlib>=3.8
      - PyYAML>=6,<7
      - pytest>=8,<10
